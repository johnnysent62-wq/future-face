workflows:
  android-workflow:
    name: Android Build

    environment:
      flutter: stable

    scripts:
      - name: Extract android.zip
        script: |
          unzip -o android.zip -d temp_extract
          mv temp_extract/android ./android
          rm -rf temp_extract

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
